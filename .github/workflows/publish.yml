name: Publish

# Publishes @sakoocloud/ai to the public npm registry when a v* tag is pushed.
# Gate: typecheck + tests + tag-matches-version must pass before publish runs.
# Auth: npm Trusted Publishing (GitHub OIDC), falling back to the NPM_TOKEN repo secret. For OIDC the
# package's Trusted Publisher on npmjs.com must name sakoocloud/sakoocloud-ai + publish.yml.
# Release: `npm run release:patch|minor|major` bumps the version and pushes the v* tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # OIDC token for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      # Fail early if the git tag doesn't match package.json's version,
      # so we never publish a mislabelled release.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      - run: npm run type-check
      - run: npm test

      # No --provenance: repo is private, and npm provenance requires a public
      # repo (it writes a public Sigstore attestation referencing repo+commit).
      # Ships dist/ + skills/ per package.json "files".
      - run: npm publish --access public
        env:
          # npm tries Trusted Publishing (OIDC) first and falls back to this token. Set the repo
          # secret NPM_TOKEN to an npm granular token (publish rights on @sakoocloud, bypass 2FA)
          # until the package's Trusted Publisher is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
